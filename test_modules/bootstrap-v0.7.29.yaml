# GoGitOps Test Module — agent binary bootstrap (wednesday, BCR-73)
# Wednesday's daemon is stranded on v0.7.22: it runs from /usr/local/bin
# (not writable by the daemon user), so every self-update cycle fails.
# v0.7.22 predates the recipe auto-apply loop, so the agent-binary-bootstrap
# RECIPE can't reach it — but the fleet-test loop DOES run on v0.7.22 and
# executes command steps from this repo. This module rides that loop to
# perform the one-time rescue: fetch the latest linux binary off the git
# binaries branch, install to ~/.local/bin/gogitops, repoint the user unit,
# restart the daemon. Guards live INSIDE each command (v0.7.22's runner
# skipped when-gated steps here), so every step is a no-op pass on any other
# node and self-disarms once /v1/health reports hardware.
name: bootstrap-v0.7.29
description: "One-time binary rescue for wednesday (v0.7.22 stranded on read-only /usr/local/bin) — rides the fleet-test loop the old daemon still runs. Self-disarms once the node reports hardware specs."
test_module: true
labels: [new-node]   # fleet-test label gate — only wednesday carries this

steps:
  - name: diag-supervision
    description: "Dump how this daemon is supervised (units, cron, parent process) into an attr for remote diagnosis"
    command: 'hostname | grep -q "^wednesday$" || exit 0; export XDG_RUNTIME_DIR="/run/user/$(id -u)"; export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"; { echo "--- user unit files:"; ls -la $HOME/.config/systemd/user/ 2>/dev/null | grep -i gogitops; echo "--- systemctl --user list:"; systemctl --user list-units --all 2>&1 | grep -i gogit; systemctl --user list-unit-files 2>&1 | grep -i gogit; echo "--- system units:"; systemctl list-units --all 2>&1 | grep -i gogit; echo "--- crontab:"; crontab -l 2>&1 | grep -v "^#" | grep -i gogit; echo "--- ps:"; ps aux | grep -i gogitops | grep -v grep; echo "--- parent chain:"; P=$$; for i in 1 2 3 4; do PP=$(ps -o ppid= -p $P | tr -d " "); echo "pid $P <- $PP: $(tr "\\0" " " < /proc/$PP/cmdline 2>/dev/null | head -c 200)"; P=$PP; done; echo "--- sudo -n check:"; sudo -n true 2>&1; echo "--- curl check:"; command -v curl || echo NO-CURL; } 2>&1'
    set_attr: bootstrap_diag

  - name: fetch-latest-binary
    description: "Pull the latest linux-amd64 binary off the git binaries branch into ~/.local/bin"
    command: 'hostname | grep -q "^wednesday$" || exit 0; curl -s -m 3 http://127.0.0.1:7780/v1/health | grep -q hardware && exit 0; R="$HOME/.config/gogitops"; cd "$R" || exit 1; git fetch -q origin binaries || exit 1; V=$(git show origin/binaries:VERSION | tr -d "\n"); mkdir -p "$HOME/.local/bin"; git show "origin/binaries:bin/gogitops-linux-amd64" > "$HOME/.local/bin/.gogitops-bootstrap" || exit 1; [ $(wc -c < "$HOME/.local/bin/.gogitops-bootstrap") -lt 500000 ] && exit 1; chmod +x "$HOME/.local/bin/.gogitops-bootstrap"; mv -f "$HOME/.local/bin/.gogitops-bootstrap" "$HOME/.local/bin/gogitops"; echo "installed $V"'
    assert: "latest binary installed to ~/.local/bin/gogitops"

  - name: repoint-launcher
    description: "Point user-level gogitops unit ExecStart at ~/.local/bin/gogitops (explicit user-session env — daemon children lack DBUS)"
    command: 'hostname | grep -q "^wednesday$" || exit 0; curl -s -m 3 http://127.0.0.1:7780/v1/health | grep -q hardware && exit 0; export XDG_RUNTIME_DIR="/run/user/$(id -u)"; export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"; C="$HOME/.local/bin/gogitops"; for U in gogitops gogitops-daemon; do F="$HOME/.config/systemd/user/$U.service"; if [ -f "$F" ]; then sed -i "s|/usr/local/bin/gogitops|$C|g" "$F" || true; echo "repointed $F"; fi; done; systemctl --user daemon-reload 2>/dev/null; echo repoint-done'

  - name: restart-daemon
    description: "Restart the daemon onto the new binary (this kills the test loop mid-run — the next tick re-verifies and self-disarms)"
    command: 'hostname | grep -q "^wednesday$" || exit 0; curl -s -m 3 http://127.0.0.1:7780/v1/health | grep -q hardware && exit 0; export XDG_RUNTIME_DIR="/run/user/$(id -u)"; export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"; for U in gogitops gogitops-daemon; do if systemctl --user is-active $U >/dev/null 2>&1; then systemctl --user restart $U && { echo "restarted-user-$U"; exit 0; }; fi; done; sudo -n systemctl restart gogitops.service 2>/dev/null || sudo -n systemctl restart gogitops-daemon.service 2>/dev/null || { curl -s -m 5 -X POST http://127.0.0.1:7780/v1/restart >/dev/null 2>&1; echo "api-restart-requested"; }'
