# GoGitOps Test Module — Docker Hosts
name: docker
description: "Assertions for nodes running Docker"
test_module: true

steps:
  - name: docker-version
    description: "Docker engine version"
    command: "docker version --format '{{.Server.Version}}' 2>/dev/null || echo 'not-available'"
    assert: "Docker engine responding"
    expect_regex: '\d+\.\d+'
    set_attr: docker_version

  - name: docker-compose
    description: "Docker Compose available"
    command: "docker compose version 2>/dev/null || docker-compose --version 2>/dev/null || echo 'not-available'"
    assert: "Docker Compose available"
    expect_regex: '\d+\.\d+'
    set_attr: docker_compose_version

  - name: docker-running-containers
    description: "Count running containers"
    command: "docker ps -q 2>/dev/null | wc -l || echo '0'"
    set_attr: docker_running_containers

  - name: docker-stopped-containers
    description: "Count stopped containers"
    command: "docker ps -a --filter 'status=exited' -q 2>/dev/null | wc -l || echo '0'"
    set_attr: docker_stopped_containers

  - name: docker-disk-usage
    description: "Docker disk usage"
    command: "docker system df --format '{{.Size}}' 2>/dev/null | head -1 || echo 'unknown'"
    set_attr: docker_disk_usage

  - name: docker-networks
    description: "Count Docker networks"
    command: "docker network ls -q 2>/dev/null | wc -l || echo '0'"
    set_attr: docker_networks

  - name: docker-healthcheck
    description: "No unhealthy containers"
    command: "docker ps --filter 'health=unhealthy' -q 2>/dev/null | wc -l || echo '0'"
    assert: "No unhealthy containers"
    expect: "0"
