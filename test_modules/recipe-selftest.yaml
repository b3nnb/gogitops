# GoGitOps Test Module — Recipe Engine Selftest
# The first YAML-written test: validates the script/module resolution order
# (self-contained-first, Sep 2026) end-to-end through temp fixtures.
# Resolution chain under test:
#   1. recipes/<name>/scripts/  — recipe-local wins always
#   2. modules/                 — fleet library fallback (cross-recipe sharing)
# Written by Friday, no Go required — tests are YAML now. ✨
name: recipe-selftest
description: "Recipe engine self-tests — script resolution order + library fallback"
test_module: true

steps:
  - name: engine-binary-available
    description: "gogitops binary resolvable (self or installed)"
    command: "test -n '{{self}}' && echo ok || echo missing"
    assert: "gogitops binary available"
    expect: "ok"

  - name: fixture-prep
    description: "Build fixture repo: recipe-local probe + same-named library probe"
    command: "rm -rf /tmp/gogitops-selftest && mkdir -p /tmp/gogitops-selftest/recipes/flip-fixture/scripts /tmp/gogitops-selftest/modules && rm -f /tmp/gogitops-selftest-marker"
    assert: "fixture directories created"

  - name: fixture-recipe-local-probe
    description: "Recipe-local probe writes recipe-local-wins marker"
    command: "echo 'echo recipe-local-wins > /tmp/gogitops-selftest-marker' > /tmp/gogitops-selftest/recipes/flip-fixture/scripts/probe.sh"
    assert: "recipe-local probe installed"

  - name: fixture-library-probe
    description: "Library probe (same filename) writes library-probe-wins marker — must NOT win over recipe-local"
    command: "echo 'echo library-probe-wins > /tmp/gogitops-selftest-marker' > /tmp/gogitops-selftest/modules/probe.sh"
    assert: "library probe installed"

  - name: fixture-recipe-yaml
    description: "Fixture recipe that runs the probe via script:"
    command: "printf 'name: flip-fixture\ndescription: resolution fixture\nversion: \"1.0.0\"\nlabels: []\nsteps:\n  - name: probe\n    script: probe.sh\n' > /tmp/gogitops-selftest/recipes/flip-fixture/flip-fixture.yaml"
    assert: "fixture recipe written"

  - name: resolution-recipe-local-wins
    description: "Run fixture recipe; the recipe-local probe must run (not the library one)"
    command: "{{self}} recipe run flip-fixture --repo /tmp/gogitops-selftest >/dev/null 2>&1; cat /tmp/gogitops-selftest-marker 2>/dev/null || echo no-marker"
    expect: "recipe-local-wins"
    assert: "recipe-local scripts resolve before library (self-contained-first)"

  - name: library-fallback-no-recipe-local
    description: "Recipe with NO recipe-local script must resolve from modules/ library"
    command: "mkdir -p /tmp/gogitops-selftest/recipes/lib-only-fixture && printf 'name: lib-only-fixture\ndescription: library fallback fixture\nversion: \"1.0.0\"\nlabels: []\nsteps:\n  - name: probe\n    script: probe.sh\n' > /tmp/gogitops-selftest/recipes/lib-only-fixture/lib-only-fixture.yaml && rm -f /tmp/gogitops-selftest-marker && {{self}} recipe run lib-only-fixture --repo /tmp/gogitops-selftest >/dev/null 2>&1; cat /tmp/gogitops-selftest-marker 2>/dev/null || echo no-marker"
    expect: "library-probe-wins"
    assert: "modules/ library serves recipes without recipe-local scripts (cross-recipe sharing)"

  - name: hydration-probe-setup
    description: "Backup device attr store + install a probe attr (restored after)"
    command: 'mkdir -p ~/.cache/gogitops && cp ~/.cache/gogitops/attrs.json ~/.cache/gogitops/attrs.json.selftest-bak 2>/dev/null; printf "{\042hydration_probe\042:\042probe-set\042}" > ~/.cache/gogitops/attrs.json; echo probe-installed'
    assert: "probe attr installed in device store"
    expect: "probe-installed"

  - name: hydration-fixture-recipe
    description: "Recipe that references device attrs ({{attr.x}} + when_attr) — written with token-splitting so this step's own substitution does not pre-bake it"
    command: 'F=/tmp/gogitops-selftest/recipes/hydration-fixture/hydration-fixture.yaml; mkdir -p $(dirname $F); echo "name: hydration-fixture" > $F; echo "description: device attr hydration probe" >> $F; echo "version: \"1.0.0\"" >> $F; echo "labels: []" >> $F; echo "steps:" >> $F; echo "  - name: gate" >> $F; echo "    command: \"echo gate=OK\"" >> $F; echo "    when_attr: \"attr.hydration_probe == probe-set\"" >> $F; echo "  - name: read" >> $F; echo "    command: \"echo probe-{{""attr.hydration_probe""}}\"" >> $F; echo fixture-written'
    assert: "hydration fixture recipe written"
    expect: "fixture-written"

  - name: hydration-recipe-reads-device-store
    description: "Run the fixture recipe — it must hydrate {{attr.hydration_probe}} + when_attr from the device store"
    command: "{{self}} recipe run hydration-fixture --repo /tmp/gogitops-selftest --verbose 2>&1 | tr '\\n' ' '"
    expect_regex: "(?s)gate=OK.*probe-probe-set"
    assert: "recipes hydrate device attrs ({{attr.x}} substitution + when_attr conditions)"

  - name: hydration-probe-restore
    description: "Restore the real device attr store"
    command: "mv ~/.cache/gogitops/attrs.json.selftest-bak ~/.cache/gogitops/attrs.json 2>/dev/null || rm ~/.cache/gogitops/attrs.json"
    assert: "device attr store restored"

  - name: attrs-catalog-scan
    description: "Universal attribute catalog lists repo-defined attrs + engine synthetics"
    command: "{{self}} attrs scan --repo {{repo}} --json"
    expect_regex: '(?s)docker_version.*tests\.pass'
    assert: "attrs scan catalogs the repo's attribute vocabulary"

  - name: attrs-validate-warns-on-typos
    description: "recipe validate warns (not blocks) on unknown attr references"
    command: 'F2=/tmp/gogitops-attr-typo.yaml; echo "name: bogus" > $F2; echo "description: x" >> $F2; echo "version: 1.0.0" >> $F2; echo "labels: []" >> $F2; echo "steps:" >> $F2; echo "  - name: t" >> $F2; echo "    command: \"echo {{attr.bogus_probe}}\"" >> $F2; {{self}} recipe validate $F2 2>&1; rm -f $F2'
    expect: "unknown attribute"
    assert: "validate warns on unknown attr references (warnings, not blocks)"

  - name: fixture-cleanup
    description: "Remove fixture"
    command: "rm -rf /tmp/gogitops-selftest /tmp/gogitops-selftest-marker"
    assert: "fixture cleaned up"
