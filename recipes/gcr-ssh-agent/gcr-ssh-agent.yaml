name: gcr-ssh-agent
description: "Standardize SSH agent to GCR (gnome-keyring successor) on GNOME desktop nodes. Disables gpg-agent SSH socket hijack, enables gcr-ssh-agent, points .bashrc at GCR socket. v1.2.0: the SSH_AUTH_SOCK rc upserts → typed system.rc-export. v1.3.0: the three systemctl steps + .bashrc upsert → one typed system.gnome-keyring step (unit outcomes are outputs, not swallowed stderr)."
version: "1.3.0"
labels:
  - gnome-desktop
auto_apply: true

steps:
  # --- Detect UID for socket path ---
  - name: detect-uid
    description: "Get user ID for XDG_RUNTIME_DIR socket path"
    command: "id -u"
    parse: regex
    pattern: "([0-9]+)"

  # --- Check gcr-ssh-agent is installed ---
  - name: check-gcr-installed
    description: "Verify gcr-ssh-agent binary exists"
    command: "test -x /usr/libexec/gcr-ssh-agent || test -x /usr/lib/gcr-ssh-agent"
    on_failure: abort

  # --- Standardize the agent stack (typed — v1.3.0) ---
  # One system.gnome-keyring call does what four steps did: enable+start
  # gcr-ssh-agent.socket, disable+mask gpg-agent-ssh.socket, disable the
  # empty ssh-agent.service, and upsert SSH_AUTH_SOCK in .bashrc. Unit
  # outcomes land as typed outputs (enabled/masked/rc_lines) instead of
  # being swallowed by 2>/dev/null; rc_lines>=1 keeps .bashrc as the
  # abort authority it always was.
  - name: standardize-gcr
    description: "Enable gcr-ssh-agent socket, disable+mask the gpg-agent SSH hijacker, retire ssh-agent.service, upsert SSH_AUTH_SOCK in .bashrc"
    func: system.gnome-keyring
    args: 'rcfiles=~/.bashrc'
    expect_regex: "rc_lines=[1-9]"
    on_failure: abort

  # --- Also set in .profile (for non-interactive shells) ---
  - name: set-profile-gcr-socket
    description: "Ensure .profile also exports GCR socket (for non-interactive / login shells)"
    func: system.rc-export
    args: 'file=~/.profile, var=SSH_AUTH_SOCK, value=/run/user/{{1}}/gcr/ssh, comment=GCR ssh-agent (modern GNOME)'
    when: "test -f $HOME/.profile"
    on_failure: continue

  # --- Verify GCR socket exists and responds ---
  - name: verify-gcr-socket
    description: "Confirm GCR socket is live and has keys"
    command: "GCR=/run/user/{{1}}/gcr/ssh; test -S "$GCR" && SSH_AUTH_SOCK=$GCR ssh-add -l 2>/dev/null | head -1 && echo GCR-VERIFIED"
    expect: "GCR-VERIFIED"
    on_failure: abort

  # --- Verify gpg-agent SSH is masked ---
  - name: verify-gpg-ssh-disabled
    description: "Confirm gpg-agent SSH socket is masked (cannot start)"
    command: "systemctl --user is-enabled gpg-agent-ssh.socket 2>/dev/null | grep -q masked && echo GPG-SSH-CONFIRMED-MASKED || echo GPG-SSH-STILL-ACTIVE"
    expect: "GPG-SSH-CONFIRMED-MASKED"
    on_failure: continue

  # --- Report (does NOT reboot; user reboots manually) ---
  - name: report-status
    description: "Summary of changes. Reboot required for session to pick up new agent."
    command: "echo 'GCR-SSH-AGENT-SETUP-COMPLETE: Reboot required for session to pick up GCR as primary SSH agent'"
    expect: "GCR-SSH-AGENT-SETUP-COMPLETE"
