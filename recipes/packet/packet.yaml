name: packet
description: "Install Packet (io.github.nozwock.Packet) from Flathub on Linux admin nodes. System flatpak where passwordless sudo exists (Friday); user-level flatpak elsewhere (Framework laptop — silent, no root needed). Darwin nodes no-op: Flathub is Linux-only. v1.2.0 (fleet function-library scan, Oct 18 '26): the sudo-mode/pkexec + flathub-channel lattice (6 shell steps, `sudo -n true` in every when:) → typed system.apt-install (flatpak bootstrap) + system.flatpak (channel resolve + remote-add + install); require=true keeps verify-packet the only aborter."
version: "1.2.0"
auto_apply: true
labels: [admin]

# Label contract (nodes/<hostname>.yaml):
#   admin — Benn's admin machines (Friday, Mini, Framework). Steps are os: linux
#           gated, so Mini (darwin) skips everything by design.

steps:
  # ── Detect ─────────────────────────────────────────────────────────────
  - name: detect-packet-before
    description: "Record whether Packet is already installed (system or user flatpak)"
    os: linux
    command: "flatpak list --app 2>/dev/null | grep -q io.github.nozwock.Packet && echo installed || echo not-installed"
    set_attr: packet_before
    on_failure: continue

  # ── Ensure flatpak itself exists (Ubuntu desktops don't ship it) ────────
  # Typed: idempotent, resolves the privilege mode itself (sudo -n /
  # pkexec / result), verifies via the flatpak binary afterwards.
  # retries: 2 preserves the old sudo channel's retries; on the rare
  # pkexec branch a declined dialog re-prompts once (the old pkexec step
  # had none — accepted trade of merging the two channels into one step).
  - name: ensure-flatpak
    description: "Install flatpak via apt — sudo mode resolved in-process (no sudo -n true probes in when: guards)"
    func: system.apt-install
    args: {"packages": "flatpak", "verify": "flatpak"}
    os: linux
    when: "! command -v flatpak >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1"
    on_failure: continue
    retries: 2
    retry_delay: 5s

  # ── Install Packet (typed channel resolution) ──────────────────────────
  # system.flatpak picks the channel: system when passwordless sudo +
  # not installed (Friday), user otherwise (laptop); flathub remote
  # ensured per channel; already-installed short-circuits. The `when:`
  # guard preserves the original "only touch flatpak when the binary
  # exists" behavior — no-flatpak is a result the step reports, not a
  # crash. require=true turns a failed install into an error so the
  # step retries and verify-packet stays the single abort authority.
  - name: install-packet
    description: "Install Packet from Flathub (channel auto-resolved: system with passwordless sudo, user without)"
    func: system.flatpak
    args: {"app": "io.github.nozwock.Packet", "require": "true"}
    os: linux
    when: "command -v flatpak >/dev/null 2>&1"
    on_failure: continue
    retries: 2
    retry_delay: 5s

  # ── Verify + report ────────────────────────────────────────────────────
  - name: detect-packet-after
    description: "Confirm install state + which installation (system or user)"
    os: linux
    command: "(flatpak list --app --columns=application,installation 2>/dev/null | grep io.github.nozwock.Packet | awk '{print $2}') || echo not-installed"
    set_attr: packet_channel
    on_failure: continue

  - name: verify-packet
    description: "Assert Packet ended up installed"
    os: linux
    command: "test \"{{attr.packet_channel}}\" != \"not-installed\""
    assert: "Packet installed (installation: {{attr.packet_channel}})"
    on_failure: abort

  - name: report-darwin
    description: "No-op report on non-Linux nodes — Flathub apps don't apply"
    os: darwin
    command: "echo 'linux-only recipe — nothing to do on darwin'"
    set_attr: packet_channel
