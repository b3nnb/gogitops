name: setup-nenv
description: "Install + configure the nenv CLI to reach the fleet NetEnv server with a live bearer token"
version: "1.4.0"
auto_apply: true
labels: []

# v1.4.0: platform detection (system.info) + CLI path resolution (system.which)
#          moved to typed stdlib funcs — os/arch arrive normalized (x86_64→amd64,
#          aarch64→arm64) and the command -v||~/.local/bin prologue is one
#          {{func.path}} instead of 4 copies of fragile shell.
#
# Full node-side nenv convergence, no manual steps:
#   1. resolve-nenv      — typed CLI lookup (PATH, then ~/.local/bin/nenv)
#   2. detect-platform   — typed os/arch (system.info) for the binaries branch
#   3. install-nenv-cli  — pull the nenv binary for this OS/arch from the
#      fleet's binaries branch (same git/SSH auth the agent self-update
#      already uses; skips when the CLI is already present)
#   4. config.toml       — written from the LIVE NENV_TOKEN env var set on
#      the gogitops agent (systemd unit Environment=) — never baked into
#      the ISO or committed. Server override: GOENV_NENV_SERVER.
#
# Capture-free by design: the engine's parse: regex stores capture GROUPS
# into {{1}}..{{n}} (overwritten by each parse step) — NOT step outputs.
# Durable state here flows through func: outputs ({{func.os}}, {{func.path}}),
# bash env ($HOME, $NENV_TOKEN) and {{repo}}.

steps:
  - name: detect-platform
    description: "Typed platform context — os/arch normalized for the binaries branch naming"
    func: system.info
    on_failure: continue

  - name: resolve-nenv
    description: "Find the nenv CLI: PATH lookup first, then ~/.local/bin/nenv"
    func: system.which
    args: {"name": "nenv", "candidates": "~/.local/bin/nenv"}
    on_failure: continue

  - name: install-nenv-cli
    description: "Install the nenv CLI from the fleet binaries branch (skips when present)"
    command: 'NENV_BIN="{{func.path}}"; if [ -n "$NENV_BIN" ]; then echo "already-present"; exit 0; fi; git -C {{repo}} fetch -q origin binaries 2>/dev/null || true; git -C {{repo}} show "origin/binaries:bin/nenv-{{func.os}}-{{func.arch}}" > "$HOME/.local/bin/nenv" 2>/dev/null || { echo "missing: nenv-{{func.os}}-{{func.arch}} not found on the binaries branch"; exit 1; }; chmod 755 "$HOME/.local/bin/nenv"; "$HOME/.local/bin/nenv" --help >/dev/null 2>&1 || { echo "broken: nenv binary will not run on this platform"; exit 1; }; echo "installed: nenv-{{func.os}}-{{func.arch}}"'
    expect_regex: "(already-present|installed: nenv-)"
    on_failure: abort

  - name: write-nenv-config
    description: "Write nenv config.toml from the live agent-env token; no-op when the existing config already works (bootstrap token needed only once per node)"
    command: 'NENV_BIN="{{func.path}}"; if [ -n "$NENV_BIN" ] && "$NENV_BIN" list global >/dev/null 2>&1; then echo "already-configured"; exit 0; fi; mkdir -p "$HOME/.config/nenv"; test -n "$NENV_TOKEN" && printf "server = \"%s\"\ntoken = \"%s\"\nnamespace = \"global\"\n" "${GOENV_NENV_SERVER:-http://10.2.0.102:7200}" "$NENV_TOKEN" > "$HOME/.config/nenv/config.toml" && chmod 600 "$HOME/.config/nenv/config.toml" || { echo "missing: NENV_TOKEN not set in agent environment and no working config"; exit 1; }; echo "written"'
    expect_regex: "(already-configured|written)"
    on_failure: abort

  - name: verify-nenv
    description: "Test nenv reaches the server and lists the global namespace"
    command: 'NENV_BIN="{{func.path}}"; test -n "$NENV_BIN" || { echo "missing: nenv CLI not found"; exit 1; }; "$NENV_BIN" list global >/dev/null 2>&1 && echo "reachable" || { echo "failed: nenv cannot reach the server (config.toml written — check server URL/token)"; exit 1; }'
    expect: "reachable"
    on_failure: abort

  - name: nenv-install-loader
    description: "Install nenv as a user secret loader (best-effort)"
    command: 'NENV_BIN="{{func.path}}"; "$NENV_BIN" install --user >/dev/null 2>&1 || echo "nenv install not available, config file written"'
    on_failure: continue