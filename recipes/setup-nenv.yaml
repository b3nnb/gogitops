name: setup-nenv
description: "Install + configure the nenv CLI to reach the fleet NetEnv server with a live bearer token"
version: "1.3.1"
auto_apply: true
labels: []

# Full node-side nenv convergence, no manual steps:
#   1. install-nenv-cli  — pull the nenv binary for this OS/arch from the
#      fleet's binaries branch (same git/SSH auth the agent self-update
#      already uses; skips when the CLI is already present)
#   2. config.toml       — written from the LIVE NENV_TOKEN env var set on
#      the gogitops agent (systemd unit Environment=) — never baked into the
#      ISO or committed. Server override: GOENV_NENV_SERVER.
#
# Capture-free by design: the engine's parse: regex stores capture GROUPS
# into {{1}}..{{n}} (overwritten by each parse step) — NOT step outputs.
# All state here flows through bash env ($HOME, $NENV_TOKEN, {{repo}}).

steps:
  - name: install-nenv-cli
    description: "Install the nenv CLI from the fleet binaries branch (skips when present)"
    command: 'NENV_BIN=$(command -v nenv 2>/dev/null || true); [ -z "$NENV_BIN" ] && [ -x "$HOME/.local/bin/nenv" ] && NENV_BIN="$HOME/.local/bin/nenv"; if [ -n "$NENV_BIN" ]; then echo "already-present"; exit 0; fi; OS=$(uname -s | tr "[:upper:]" "[:lower:]"); ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && ARCH=amd64; [ "$ARCH" = "aarch64" ] && ARCH=arm64; git -C {{repo}} fetch -q origin binaries 2>/dev/null || true; git -C {{repo}} show "origin/binaries:bin/nenv-$OS-$ARCH" > "$HOME/.local/bin/nenv" 2>/dev/null || { echo "missing: nenv-$OS-$ARCH not found on the binaries branch"; exit 1; }; chmod 755 "$HOME/.local/bin/nenv"; "$HOME/.local/bin/nenv" --help >/dev/null 2>&1 || { echo "broken: nenv binary will not run on this platform"; exit 1; }; echo "installed: nenv-$OS-$ARCH"'
    expect_regex: "(already-present|installed: nenv-)"
    on_failure: abort
  - name: write-nenv-config
    description: "Write nenv config.toml from the live agent-env token; no-op when the existing config already works (bootstrap token needed only once per node)"
    command: 'NENV_BIN=$(command -v nenv 2>/dev/null || true); [ -z "$NENV_BIN" ] && [ -x "$HOME/.local/bin/nenv" ] && NENV_BIN="$HOME/.local/bin/nenv"; if [ -n "$NENV_BIN" ] && "$NENV_BIN" list global >/dev/null 2>&1; then echo "already-configured"; exit 0; fi; mkdir -p "$HOME/.config/nenv"; test -n "$NENV_TOKEN" && printf "server = \"%s\"\ntoken = \"%s\"\nnamespace = \"global\"\n" "${GOENV_NENV_SERVER:-http://10.2.0.102:7200}" "$NENV_TOKEN" > "$HOME/.config/nenv/config.toml" && chmod 600 "$HOME/.config/nenv/config.toml" || { echo "missing: NENV_TOKEN not set in agent environment and no working config"; exit 1; }; echo "written"'
    expect_regex: "(already-configured|written)"
    on_failure: abort

  - name: verify-nenv
    description: "Test nenv reaches the server and lists the global namespace"
    command: 'NENV_BIN=$(command -v nenv 2>/dev/null || true); [ -z "$NENV_BIN" ] && [ -x "$HOME/.local/bin/nenv" ] && NENV_BIN="$HOME/.local/bin/nenv"; test -n "$NENV_BIN" || { echo "missing: nenv CLI not found"; exit 1; }; "$NENV_BIN" list global >/dev/null 2>&1 && echo "reachable" || { echo "failed: nenv cannot reach the server (config.toml written — check server URL/token)"; exit 1; }'
    expect: "reachable"
    on_failure: abort

  - name: nenv-install-loader
    description: "Install nenv as a user secret loader (best-effort)"
    command: 'NENV_BIN=$(command -v nenv 2>/dev/null || true); [ -z "$NENV_BIN" ] && [ -x "$HOME/.local/bin/nenv" ] && NENV_BIN="$HOME/.local/bin/nenv"; "$NENV_BIN" install --user >/dev/null 2>&1 || echo "nenv install not available, config file written"'
    on_failure: continue
