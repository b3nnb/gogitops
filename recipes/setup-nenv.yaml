name: setup-nenv
description: "Configure nenv CLI to connect to the fleet NetEnv server with a live bearer token"
version: "1.2.0"
auto_apply: true
labels: []

# Token delivery: NENV_TOKEN env var on the gogitops agent (systemd unit
# Environment=). Config is written from the LIVE token at recipe runtime —
# never baked into the ISO or committed. Server override: GOENV_NENV_SERVER.
#
# Capture-free by design: the engine's parse: regex stores capture GROUPS
# into {{1}}..{{n}} (overwritten by each parse step) — NOT step outputs.
# The v1.0/v1.1 {{1}}/{{2}}/{{3}} positional design never worked. All state
# here flows through bash env ($HOME, $NENV_TOKEN) — no {{n}} at all.

steps:
  - name: create-nenv-config-dir
    description: "Create ~/.config/nenv/"
    command: 'mkdir -p "$HOME/.config/nenv"'
    on_failure: abort

  - name: write-nenv-config
    description: "Write nenv config.toml from the live agent-env token (abort if missing)"
    command: 'test -n "$NENV_TOKEN" && printf "server = \"%s\"\ntoken = \"%s\"\nnamespace = \"global\"\n" "${GOENV_NENV_SERVER:-http://10.2.0.102:7200}" "$NENV_TOKEN" > "$HOME/.config/nenv/config.toml" && chmod 600 "$HOME/.config/nenv/config.toml" || { echo "missing: NENV_TOKEN not set in agent environment"; exit 1; }'
    on_failure: abort

  - name: verify-nenv
    description: "Test nenv reaches the server and lists the global namespace"
    command: 'NENV_BIN=$(command -v nenv 2>/dev/null || true); [ -z "$NENV_BIN" ] && [ -x "$HOME/.local/bin/nenv" ] && NENV_BIN="$HOME/.local/bin/nenv"; test -n "$NENV_BIN" || { echo "missing: nenv CLI not found"; exit 1; }; "$NENV_BIN" list global >/dev/null 2>&1 && echo "reachable" || { echo "failed: nenv cannot reach the server (config.toml written — check server URL/token)"; exit 1; }'
    expect: "reachable"
    on_failure: abort

  - name: nenv-install-loader
    description: "Install nenv as a user secret loader (best-effort)"
    command: 'NENV_BIN=$(command -v nenv 2>/dev/null || true); [ -z "$NENV_BIN" ] && [ -x "$HOME/.local/bin/nenv" ] && NENV_BIN="$HOME/.local/bin/nenv"; "$NENV_BIN" install --user >/dev/null 2>&1 || echo "nenv install not available, config file written"'
    on_failure: continue
