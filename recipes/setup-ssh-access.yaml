name: setup-ssh-access
description: "Set up SSH authorized_keys.d directory with key from gogitops repo"
version: "1.0.0"
labels: []  # all nodes

params:
  - name: key_name
    description: "Name of the SSH public key file in the repo (without .pub)"
    required: false

steps:
  # --- Detect OS ---
  - name: detect-os
    description: "Detect operating system for sshd config path"
    command: "uname -s | tr '[:upper:]' '[:lower:]'"
    parse: regex
    pattern: "(.+)"

  # --- Create SSH directory structure ---
  - name: create-ssh-dirs
    description: "Create ~/.ssh and authorized_keys.d directory"
    command: "mkdir -p ~/.ssh/authorized_keys.d && chmod 700 ~/.ssh"
    on_failure: abort

  # --- Copy SSH key from repo ---
  - name: copy-key-default
    description: "Copy friday-automation.pub from gogitops repo (default key)"
    command: "cp {{repo}}/install/ssh/friday-automation.pub ~/.ssh/authorized_keys.d/friday-automation && chmod 600 ~/.ssh/authorized_keys.d/friday-automation"
    when: "test -f {{repo}}/install/ssh/friday-automation.pub"
    on_failure: continue

  - name: copy-key-named
    description: "Copy named SSH key from gogitops repo"
    command: "cp {{repo}}/install/ssh/{{key_name}}.pub ~/.ssh/authorized_keys.d/{{key_name}} && chmod 600 ~/.ssh/authorized_keys.d/{{key_name}}"
    when: "test -n '{{key_name}}' && test -f {{repo}}/install/ssh/{{key_name}}.pub"
    on_failure: continue

  # --- Ensure authorized_keys exists (fallback) ---
  - name: touch-authorized-keys
    description: "Ensure legacy authorized_keys file exists"
    command: "touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys"
    on_failure: continue

  # --- Configure sshd for authorized_keys.d (Linux only) ---
  - name: configure-sshd-linux
    description: "Add AuthorizedKeysFile directive to sshd_config if missing"
    os: linux
    command: "grep -q 'authorized_keys.d' /etc/ssh/sshd_config || echo 'AuthorizedKeysFile .ssh/authorized_keys.d/%u .ssh/authorized_keys' | sudo tee -a /etc/ssh/sshd_config"
    on_failure: continue

  - name: restart-sshd-linux
    description: "Restart sshd to pick up new config"
    os: linux
    command: "sudo systemctl restart sshd 2>/dev/null || sudo systemctl restart ssh 2>/dev/null || true"
    when: "grep -q 'authorized_keys.d' /etc/ssh/sshd_config"
    on_failure: continue

  # --- macOS: sshd config is different ---
  - name: configure-sshd-macos
    description: "Add AuthorizedKeysFile directive to macOS sshd_config"
    os: darwin
    command: "grep -q 'authorized_keys.d' /etc/ssh/sshd_config || echo 'AuthorizedKeysFile .ssh/authorized_keys.d/%u .ssh/authorized_keys' | sudo tee -a /etc/ssh/sshd_config"
    on_failure: continue

  # --- Verify ---
  - name: verify-keys-dir
    description: "Confirm authorized_keys.d directory exists"
    command: "test -d ~/.ssh/authorized_keys.d"
    on_failure: abort

  - name: verify-key-present
    description: "Confirm at least one key is installed"
    command: "ls ~/.ssh/authorized_keys.d/*.pub ~/.ssh/authorized_keys.d/* 2>/dev/null | head -1"
    expect_regex: ".+"
    on_failure: abort

  - name: verify-sshd-config
    description: "Confirm sshd config includes authorized_keys.d"
    command: "grep -c 'authorized_keys.d' /etc/ssh/sshd_config 2>/dev/null || echo 0"
    on_failure: continue
