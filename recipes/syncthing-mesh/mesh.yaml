# syncthing mesh — fleet interconnection topology (versioned in git)
#
# Device IDs: netenv (`nenv get syncthing <name>`) wins when published;
# the seed ids below are fallbacks. Each node publishes its own ID to
# netenv on mesh apply (attribute fallback when nenv is absent).
#
# NOTE: folder ids must match EXACTLY across the fleet — syncthing does
# NOT trim-match cluster-config folder ids (v2.1.5 rejects them with
# "Unexpected folder ID in ClusterConfig"). The vault id is the clean
# "obsidian-vault" (2026-09-19: a leading-space variant briefly broke
# the mini+pixel pairings; fixed by renaming on Friday + this file).

devices:
