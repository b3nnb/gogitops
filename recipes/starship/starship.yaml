name: starship-terminal-setup
description: "Install Starship prompt + Friday login splash on any node — idempotent, self-reporting"
version: "2.3.0"
labels: []

# v2.3.0 (fleet function-library scan, Oct 11 '26): platform detect → typed
# system.info, the 8× "grep -q … || printf … >>" rc-file edits → typed
# system.rc-line, the LAN IP probe → typed net.lan-ip. The printf/awk
# quoting landmines are gone; rc appends are idempotent by construction.

steps:
  # ── Environment (typed — no shell) ────────────────────────────────────
  - name: detect-platform
    description: "Typed platform context — os/arch arrive normalized for fleet branching"
    func: system.info
    on_failure: continue

  # ── Create directories first (starship installer needs its bin dir) ───
  - name: create-dirs
    description: "Create config, bin, and cache directories"
    command: "mkdir -p $HOME/.config $HOME/.local/bin $HOME/bin $HOME/.cache/gogitops"

  # ── Starship: check, then install only if missing ─────────────────────
  - name: check-starship
    description: "Check whether starship is already installed"
    command: "command -v starship >/dev/null 2>&1 && starship --version | head -1 || echo not-installed"
    set_attr: starship_before

  - name: install-starship
    description: "Install starship to ~/.local/bin via official installer (no sudo needed)"
    command: "curl -sS https://starship.rs/install.sh | sh -s -- -b $HOME/.local/bin -y"
    when: "! command -v starship >/dev/null 2>&1"
    on_failure: abort
    retries: 2
    retry_delay: 5s

  - name: ensure-path-bash
    description: "Ensure ~/.local/bin is on PATH in .bashrc"
    func: system.rc-line
    args: 'file=~/.bashrc, marker=.local/bin, line=\nexport PATH="$HOME/.local/bin:$PATH"\n'
    when: "test -f $HOME/.bashrc 2>/dev/null || echo $SHELL | grep -q bash"
    on_failure: continue

  - name: ensure-path-zsh
    description: "Ensure ~/.local/bin is on PATH in .zshrc"
    func: system.rc-line
    args: 'file=~/.zshrc, marker=.local/bin, line=\nexport PATH="$HOME/.local/bin:$PATH"\n'
    when: "test -f $HOME/.zshrc || echo $SHELL | grep -q zsh"
    on_failure: continue

  # ── Deploy config files from the repo ────────────────────────────────
  - name: drop-starship-config
    description: "Deploy starship.toml from gogitops repo"
    command: "cp {{repo}}/recipes/starship/starship.toml $HOME/.config/starship.toml"
    on_failure: abort

  - name: drop-prompt-helper
    description: "Deploy gogitops prompt helper for fleet status module"
    command: "cp {{repo}}/recipes/starship/gogitops_prompt.py $HOME/.local/bin/gogitops_prompt.py && chmod +x $HOME/.local/bin/gogitops_prompt.py"
    on_failure: continue

  - name: drop-dashboard
    description: "Deploy the login splash dashboard script"
    command: "cp {{repo}}/recipes/starship/dashboard $HOME/bin/dashboard && chmod +x $HOME/bin/dashboard"
    on_failure: abort

  # ── ASCII art renderer (best effort — degrades to plain text) ─────────
  # Universal step: the agent translates pkg: → brew/apt/dnf/zypper/pacman/apk
  # and pip: → python3 -m pip --user. Same recipe on every OS.
  - name: install-figlet
    description: "Install figlet (agent picks the local package manager), falls back to pip pyfiglet"
    package: figlet
    sources: "[pkg:figlet, pip:pyfiglet]"
    when: "! command -v figlet >/dev/null 2>&1"
    on_failure: continue

  - name: report-ascii-renderer
    description: "Report which ASCII art renderer this node will use"
    command: "command -v figlet >/dev/null 2>&1 && echo figlet || (python3 -c 'import pyfiglet' 2>/dev/null && echo pyfiglet) || echo plain"
    set_attr: ascii_renderer

  # ── Shell init (idempotent — greps before appending) ──────────────────
  - name: init-starship-bash
    description: "Add starship init to .bashrc if missing"
    func: system.rc-line
    args: 'file=~/.bashrc, marker=starship init, line=eval "$(starship init bash)"\n'
    when: "test -f $HOME/.bashrc 2>/dev/null || echo $SHELL | grep -q bash"
    on_failure: continue

  - name: init-starship-zsh
    description: "Add starship init to .zshrc if missing"
    func: system.rc-line
    args: 'file=~/.zshrc, marker=starship init zsh, line=\neval "$(starship init zsh)"\n'
    when: "test -f $HOME/.zshrc || echo $SHELL | grep -q zsh"
    on_failure: continue

  - name: init-dashboard-hook-bash
    description: "Add first-shell dashboard splash + alias to .bashrc if missing"
    func: system.rc-line
    args: 'file=~/.bashrc, marker=bin/dashboard, line=\n# Login dashboard (first shell only) + alias to re-show\nif [ -z "$GOGITOPS_DASHBOARD_SHOWN" ]; then\n    export GOGITOPS_DASHBOARD_SHOWN=1\n    $HOME/bin/dashboard\nfi\n'
    when: "test -f $HOME/.bashrc 2>/dev/null || echo $SHELL | grep -q bash"
    on_failure: continue

  - name: init-dashboard-hook-zsh
    description: "Add first-shell dashboard splash to .zshrc if missing (alias split into its own step, mirroring the bash side)"
    func: system.rc-line
    args: 'file=~/.zshrc, marker=bin/dashboard, line=\n# Login dashboard (first shell only) + alias to re-show\nif [ -z "$GOGITOPS_DASHBOARD_SHOWN" ]; then\n    export GOGITOPS_DASHBOARD_SHOWN=1\n    $HOME/bin/dashboard\nfi\n'
    when: "test -f $HOME/.zshrc || echo $SHELL | grep -q zsh"
    on_failure: continue

  - name: init-dashboard-alias-bash
    description: "Add dashboard alias to .bashrc if missing"
    func: system.rc-line
    args: 'file=~/.bashrc, marker=alias dashboard=, line=alias dashboard="$HOME/bin/dashboard"\n'
    when: "test -f $HOME/.bashrc 2>/dev/null || echo $SHELL | grep -q bash"
    on_failure: continue

  - name: init-dashboard-alias-zsh
    description: "Add dashboard alias to .zshrc if missing"
    func: system.rc-line
    args: 'file=~/.zshrc, marker=alias dashboard=, line=alias dashboard="$HOME/bin/dashboard"\n'
    when: "test -f $HOME/.zshrc || echo $SHELL | grep -q zsh"
    on_failure: continue

  # ── External IP cache (for the splash) ────────────────────────────────
  - name: cache-external-ip
    description: "Cache public IP now so the splash has data immediately"
    command: "curl -s --max-time 5 ifconfig.me > $HOME/.cache/external_ip"
    on_failure: continue

  - name: schedule-ip-refresh
    description: "Refresh the cached public IP hourly (agent installs the cron entry, idempotent)"
    schedule: hourly
    command: "curl -s --max-time 3 ifconfig.me > $HOME/.cache/external_ip 2>/dev/null"
    on_failure: continue

  # ── Verify + report ───────────────────────────────────────────────────
  - name: verify-starship
    description: "Confirm starship binary is callable"
    command: "PATH=$HOME/.local/bin:$PATH starship --version | head -1"
    expect_regex: "starship"
    set_attr: starship_version
    assert: "starship installed and callable"
    on_failure: abort

  - name: verify-config
    description: "Confirm starship.toml is deployed"
    command: "test -f $HOME/.config/starship.toml"
    assert: "starship config deployed"

  - name: verify-dashboard-syntax
    description: "Bash syntax check on the deployed dashboard"
    command: "bash -n $HOME/bin/dashboard"
    assert: "dashboard script syntax valid"

  - name: smoke-test-dashboard
    description: "Render the dashboard non-interactively to prove it works"
    command: "bash $HOME/bin/dashboard > /dev/null 2>&1"
    assert: "dashboard renders without error"
    on_failure: continue

  - name: report-nickname
    description: "Report the node nickname the splash will display"
    command: "cat $HOME/.config/node-nickname 2>/dev/null || echo {{hostname}}"
    set_attr: nickname

  - name: report-private-ip
    description: "Report LAN IP (typed — net.lan-ip replaces the hostname -I / ipconfig / route dance)"
    func: net.lan-ip
    set_attr: private_ip

  - name: report-public-ip
    description: "Report cached public IP"
    command: "cat $HOME/.cache/external_ip 2>/dev/null || echo unknown"
    set_attr: public_ip

  - name: report-gpu
    description: "Report GPU model + driver if present"
    command: "gpu=$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader 2>/dev/null | head -1); echo ${gpu:-none}"
    set_attr: gpu

  - name: deploy-summary
    description: "Compile the full deployment report as one attribute"
    command: "echo starship={{attr.starship_version}} splash={{attr.nickname}} gpu={{attr.gpu}} lan={{func.ip}} wan={{attr.public_ip}} ascii={{attr.ascii_renderer}}"
    set_attr: deploy_summary
