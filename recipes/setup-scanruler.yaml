name: setup-scanruler
description: "Install ScanRuler MCP server (scanruler-mcp) for AI-driven 3D scan reverse engineering. Requires Node.js 22+ and a browser. Idempotent — skips if already configured."
version: "1.0.0"
labels: [scanruler, mcp-server]

steps:
  # ── 1. Detect platform ──
  - name: detect-platform
    description: "Detect OS type"
    command: "uname -s"
    parse: regex
    pattern: "(.+)"

  # ── 2. Check Node.js version (need 22+) ──
  - name: check-node
    description: "Check if Node.js 22+ is installed"
    command: "node --version 2>/dev/null || echo 'not-found'"
    parse: regex
    pattern: "(.+)"
    on_failure: continue

  # ── 3. Install Node.js 22+ if missing (Linux) ──
  - name: linux-install-node
    description: "Install Node.js 22 LTS on Linux if not present or too old"
    command: "if [ -z \"$(node --version 2>/dev/null)\" ]; then curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && sudo apt-get install -y nodejs; else echo \"Node.js $(node --version) present\"; fi"
    on_failure: abort
    condition: "{{.detect-platform}} == Linux"

  # ── 3b. Install Node.js 22+ if missing (macOS) ──
  - name: macos-install-node
    description: "Install Node.js 22+ via Homebrew on macOS if not present or too old"
    command: "if [ -z \"$(node --version 2>/dev/null)\" ]; then brew install node@22; else echo \"Node.js $(node --version) present\"; fi"
    on_failure: abort
    condition: "{{.detect-platform}} == Darwin"

  # ── 4. Verify npx is available ──
  - name: verify-npx
    description: "Confirm npx is available for running scanruler-mcp"
    command: "npx --version"
    on_failure: abort

  # ── 5. Pre-fetch scanruler-mcp package (warm the npx cache) ──
  - name: prefetch-scanruler
    description: "Pre-fetch scanruler-mcp package so first use is instant"
    command: "npm cache add scanruler-mcp@latest 2>/dev/null || npx -y scanruler-mcp@latest --version 2>/dev/null || echo 'Will fetch on first use'"
    on_failure: continue

  # ── 6. Add scanruler MCP server to Hermes config ──
  - name: add-scanruler-mcp
    description: "Add scanruler-mcp to Hermes config.yaml mcp_servers if not already present"
    command: "python3 recipes/setup-scanruler/scripts/add-mcp-config.py"
    on_failure: abort

  # ── 7. Verify config was updated ──
  - name: verify-config
    description: "Confirm scanruler is in the Hermes config"
    command: "grep -c 'scanruler' $HOME/.hermes/config.yaml"
    parse: regex
    pattern: "(\\d+)"
    on_failure: abort

  # ── 8. Print next steps ──
  - name: next-steps
    description: "Print usage instructions"
    command: "echo 'ScanRuler MCP installed. Restart Hermes, open scanruler.com in a browser, and say Connect to ScanRuler to pair. Requires Chrome/Edge/Firefox.'"
    on_failure: continue