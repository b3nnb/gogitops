name: obsidian-vault
description: "Ensure Obsidian is installed on admin nodes; pre-configure the remote vault connection on remote-admin nodes (non-Friday devices only — Friday hosts the vault natively)"
version: "1.6.0"
# v1.6.0: brew cask + deb URL resolution moved to typed stdlib funcs
#         (system.which, net.github-asset) — the inline BREW=$(...) shell was
#         escaping-corrupted (exit 127 on every mac); the deb scrape is now
#         a JSON-parsed walk of the 10 newest releases.
auto_apply: true
labels: [admin]

# Label contract (nodes/<hostname>.yaml):
#   admin        — Benn's admin machines; recipe scope. Friday, Mini, Framework.
#   remote-admin — narrower: devices that connect to the vault REMOTELY (non-Friday).
#                  Friday is excluded on purpose: the canonical vault lives there.

steps:
  # ── Environment ────────────────────────────────────────────────────────
  - name: detect-os
    description: "Record operating system"
    command: "uname -s | tr '[:upper:]' '[:lower:]'"
    set_attr: os

  - name: detect-arch
    description: "Record CPU architecture"
    command: "uname -m"
    set_attr: arch

  - name: detect-obsidian-before
    description: "Check whether Obsidian is already present in any install form"
    command: "(command -v obsidian >/dev/null 2>&1 && echo PATH) || (flatpak list 2>/dev/null | grep -q md.obsidian.Obsidian && echo FLATPAK) || (snap list 2>/dev/null | grep -q '^obsidian' && echo SNAP) || (ls /Applications ~/Applications 2>/dev/null | grep -qi obsidian && echo APPS) || (find $HOME -maxdepth 3 -name 'Obsidian*.AppImage' 2>/dev/null | head -1 | grep -q AppImage && echo APPIMAGE) || echo not-installed"
    set_attr: obsidian_before

  # ── Install: detect the local install channel, never assume ────────────
  # Friday's pattern is flatpak; remote nodes may differ. Idempotent guards.
  - name: install-obsidian-flatpak
    description: "Install Obsidian via system flatpak (Friday's channel)"
    command: "sudo -n flatpak install -y --noninteractive flathub md.obsidian.Obsidian"
    when: "sudo -n true 2>/dev/null && ! (command -v obsidian >/dev/null 2>&1 || flatpak list 2>/dev/null | grep -q md.obsidian.Obsidian || snap list 2>/dev/null | grep -q '^obsidian' || ls /Applications ~/Applications 2>/dev/null | grep -qi obsidian) && command -v flatpak >/dev/null 2>&1"
    on_failure: continue
    retries: 2
    retry_delay: 5s

  - name: install-obsidian-snap
    description: "Install Obsidian via snap (flatpak not present)"
    command: "sudo -n snap install obsidian --classic"
    when: "sudo -n true 2>/dev/null && ! (command -v obsidian >/dev/null 2>&1 || snap list 2>/dev/null | grep -q '^obsidian' || ls /Applications ~/Applications 2>/dev/null | grep -qi obsidian) && command -v snap >/dev/null 2>&1 && ! command -v flatpak >/dev/null 2>&1"
    on_failure: continue
    retries: 2
    retry_delay: 5s

  # ── Resolve brew once (typed, no shell quoting to corrupt) ─────────────
  - name: resolve-brew
    description: "Find brew: PATH lookup first, then /opt/homebrew/bin + /usr/local/bin fallbacks"
    func: system.which
    args: {"name": "brew", "candidates": "/opt/homebrew/bin/brew,/usr/local/bin/brew"}
    on_failure: continue

  - name: install-obsidian-brew
    description: "Install Obsidian via Homebrew cask (macOS nodes) — brew resolved once via system.which (launchd agents have no /opt/homebrew/bin in PATH)"
    command: '"{{func.path}}" install --cask obsidian'
    when: "! (command -v obsidian >/dev/null 2>&1 || ls /Applications 2>/dev/null | grep -qi obsidian) && (command -v brew >/dev/null 2>&1 || test -x /opt/homebrew/bin/brew || test -x /usr/local/bin/brew)"
    on_failure: continue
    retries: 2
    retry_delay: 5s

  - name: install-obsidian-flatpak-user
    description: "Install Obsidian via user-level flatpak — NO sudo needed (flatpak present but no passwordless sudo)"
    command: "flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo && flatpak --user install -y --noninteractive flathub md.obsidian.Obsidian"
    when: "! (command -v obsidian >/dev/null 2>&1 || flatpak list 2>/dev/null | grep -q md.obsidian.Obsidian || snap list 2>/dev/null | grep -q '^obsidian' || ls /Applications ~/Applications 2>/dev/null | grep -qi obsidian) && command -v flatpak >/dev/null 2>&1"
    on_failure: continue
    retries: 2
    retry_delay: 10s

  # ── Deb URL from the GitHub API, JSON-parsed (walk releases: the newest
  #    tag often ships only the .apk — desktop assets lag days behind) ──
  # Same when: as the install step — the API is only hit when needed.
  - name: resolve-obsidian-deb
    description: "Newest release that actually ships an amd64.deb asset"
    func: net.github-asset
    args: repo=obsidianmd/obsidian-releases, match=amd64.deb, walk=10
    when: "! (command -v obsidian >/dev/null 2>&1 || flatpak list 2>/dev/null | grep -q md.obsidian.Obsidian || snap list 2>/dev/null | grep -q '^obsidian' || ls /Applications ~/Applications 2>/dev/null | grep -qi obsidian) && ! test -x $HOME/Applications/obsidian/opt/Obsidian/obsidian && command -v dpkg-deb >/dev/null 2>&1 && uname -s | grep -qi linux"
    on_failure: continue

  - name: install-obsidian-deb-extract
    description: "Last-resort no-sudo install: download the newest release that ships a desktop .deb, extract to ~/Applications userland (dpkg-deb -x), symlink into PATH"
    command: 'test "{{func.found}}" = "true" && curl -sL --max-time 300 "{{func.url}}" -o /tmp/obsidian.deb && mkdir -p $HOME/Applications/obsidian && dpkg-deb -x /tmp/obsidian.deb $HOME/Applications/obsidian && ln -sf $HOME/Applications/obsidian/opt/Obsidian/obsidian $HOME/.local/bin/obsidian && rm -f /tmp/obsidian.deb'
    when: "! (command -v obsidian >/dev/null 2>&1 || flatpak list 2>/dev/null | grep -q md.obsidian.Obsidian || snap list 2>/dev/null | grep -q '^obsidian' || ls /Applications ~/Applications 2>/dev/null | grep -qi obsidian) && ! test -x $HOME/Applications/obsidian/opt/Obsidian/obsidian && command -v dpkg-deb >/dev/null 2>&1 && uname -s | grep -qi linux"
    on_failure: continue
    retries: 2
    retry_delay: 10s

  # ── Remote vault connection — remote-admin nodes ONLY ─────────────────
  # Friday (admin but NOT remote-admin) skips this whole block on label scope.
  - name: create-vault-dir
    description: "Create the remote vault directory (mirrors Friday's vault path)"
    command: "mkdir -p \"$HOME/Documents/Obsidian Vault\""
    labels_required: [remote-admin]
    on_failure: abort

  - name: drop-vault-pointer
    description: "Write the vault path pointer so agents and tools find the vault (all admin nodes)"
    command: "mkdir -p $HOME/.config/gogitops && printf '%s/Documents/Obsidian Vault\n' $HOME > $HOME/.config/gogitops/obsidian-vault.path"
    labels_required: [admin]
    on_failure: continue

  - name: ensure-syncthing
    description: "Ensure Syncthing (vault transport) is installed — agent picks the package manager"
    package: syncthing
    sources: "[pkg:syncthing]"
    when: "! command -v syncthing >/dev/null 2>&1"
    labels_required: [remote-admin]
    on_failure: continue

  - name: report-syncthing-state
    description: "Report whether Syncthing is running on this node"
    command: "(systemctl --user is-active syncthing 2>/dev/null || systemctl is-active syncthing 2>/dev/null || echo inactive) | head -1"
    labels_required: [remote-admin]
    set_attr: syncthing_state
    on_failure: continue

  # ── Verify + report ───────────────────────────────────────────────────
  - name: register-vault
    description: "Register the vault in this node's Obsidian config (idempotent; auto-detects flatpak/mac/native) — pre-configures first launch on remote nodes, self-heals Friday's registration"
    script: register_vault.py
    script_lang: python
    labels_required: [admin]
    # ABORT (not continue): a skipped/deferred/failed registration must NOT count
    # as converged or the daemon never retries it — that's exactly how framework
    # sat "converged" with no obsidian.json for hours (defer+continue = silent
    # deadlock). Non-zero exits (2=dir missing, 3=Obsidian running) now fail the
    # recipe so auto-apply retries until the write actually lands.
    on_failure: abort

  - name: detect-obsidian-after
    description: "Confirm Obsidian is present in some install form"
    command: "(command -v obsidian >/dev/null 2>&1 && echo PATH) || (flatpak list 2>/dev/null | grep -q md.obsidian.Obsidian && echo FLATPAK) || (snap list 2>/dev/null | grep -q '^obsidian' && echo SNAP) || (ls /Applications ~/Applications 2>/dev/null | grep -qi obsidian && echo APPS) || echo not-installed"
    set_attr: obsidian_after

  - name: verify-obsidian
    description: "Assert Obsidian ended up installed somewhere"
    command: "test \"{{attr.obsidian_after}}\" != \"not-installed\""
    assert: "Obsidian installed (channel: {{attr.obsidian_after}})"
    on_failure: abort

  - name: vault-status
    description: "Report vault role: host (Friday) or remote (remote-admin)"
    command: "echo 'host (vault is local) - remote-admin block skipped by design'"
    labels_exclude: [remote-admin]
    set_attr: vault_role
    on_failure: continue

  - name: vault-role-remote
    description: "Report vault role: remote"
    command: "echo 'remote (vault syncs from Friday via Syncthing; dir + pointer staged)'"
    labels_required: [remote-admin]
    set_attr: vault_role
    on_failure: continue

  - name: deploy-summary
    description: "Compile the full deployment report as one attribute"
    command: "echo 'os={{attr.os}} obsidian={{attr.obsidian_after}} role={{attr.vault_role}} syncthing={{attr.syncthing_state}}'"
    set_attr: deploy_summary
