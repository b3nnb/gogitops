name: dashboard-pull-setup
description: "Make this node's agent pull-able by the fleet dashboard/beacon (Friday :7781): bind all interfaces, register the beacon URL, fix hand-rolled units that hardcode -bind 127.0.0.1, open ufw to the dashboard node, restart, verify. macOS note: daemon is hand-started — flags apply at next start. v1.1.0: beacon verification → typed net.http-check; v1.2.0: LAN-IP discovery + node-identity resolution → typed net.source-ip / net.json-get (no ip-route-grep, no curl|grep JSON scrapes)"
version: "1.2.0"
labels: []

steps:
  - name: set-bind
    description: "agent.env: bind 0.0.0.0 so the dashboard can poll :7780"
    command: "{{self}} set bind 0.0.0.0"
    on_failure: continue

  - name: set-beacon
    description: "agent.env: beacon/dashboard URL — the agent also registers itself there"
    command: "{{self}} set dashboard http://10.2.0.102:7781"
    on_failure: continue

  - name: fix-unit-bind
    description: "Hand-rolled user units with hardcoded -bind 127.0.0.1 (framework): rewrite the flag — env config cannot override a CLI flag"
    command: 'U=$HOME/.config/systemd/user/gogitops.service; if [ -f "$U" ] && grep -q "bind 127\.0\.0\.1" "$U"; then sed -i "s/bind 127\.0\.0\.1/bind 0.0.0.0/" "$U" && systemctl --user daemon-reload && echo user-unit-rebound; else echo user-unit-ok; fi'
    os: linux
    on_failure: continue

  - name: restart-agent
    description: "MANUAL RUNS ONLY — the daemon convergence loop sets GOGITOPS_AUTO_APPLY=1 for its children, and a restart spawned from inside a convergence run kills the daemon mid-recipe: the recipe records failed forever and every cycle restarts the agent again (framework ~60s restart-loop, Sep 30 '26). A skipped restart just means a rewritten unit applies on the next manual run or daemon restart."
    when: '[ -z "$GOGITOPS_AUTO_APPLY" ]'
    command: 'for U in gogitops gogitops-daemon; do if systemctl --user is-active $U >/dev/null 2>&1; then systemctl --user restart $U && echo restarted-user-$U; exit 0; fi; done; if systemctl is-active gogitops-daemon >/dev/null 2>&1; then sudo -n systemctl restart gogitops-daemon && echo restarted-system; else echo WARN-no-unit-restarted; fi'
    os: linux
    on_failure: continue

  - name: ufw-allow-dashboard
    description: "If ufw is active: allow the dashboard node to reach the agent API (no-op when inactive/absent)"
    command: 'if command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q "Status: active"; then sudo -n ufw allow from 10.2.0.102 to any port 7780 proto tcp >/dev/null && echo ufw-rule-added; else echo ufw-not-active; fi'
    os: linux
    on_failure: continue

  # ── Verify (typed) ─────────────────────────────────────────────────────
  # v1.2.0: the old verify-pullable discovered the LAN IP with
  # `ip -4 route get 10.2.0.102 | grep -oP 'src \K[0-9.]+'` and retried
  # curl in a shell loop. Two typed steps now: the kernel picks the source
  # address (net.source-ip), net.http-check owns the retry loop.

  - name: resolve-lan-ip
    description: "The source IP the kernel uses to reach the beacon — the address the beacon polls back (typed UDP route probe, nothing sent)"
    func: net.source-ip
    args: host=10.2.0.102
    os: linux

  - name: verify-pullable
    description: "Agent API must answer on the LAN IP — the address the beacon polls (retries while the freshly restarted daemon binds)"
    func: net.http-check
    args: url=http://{{func.ip}}:7780/v1/health, contains=hostname, require=true
    retries: 6
    retry_delay: 5s
    os: linux

  - name: resolve-node-identity
    description: "Fleet identity resolved by ASKING THE LOCAL AGENT (self-truth) — {{hostname}} is the SYSTEM hostname on manual runs without -hostname (benn-Laptop-…), which the beacon never lists, false-failing healthy nodes (found on framework, Sep 30 '26)"
    func: net.json-get
    args: url=http://127.0.0.1:7780/v1/health, key=hostname
    expect: found=true
    os: linux

  - name: verify-beacon-sees-node
    description: "Beacon status API lists this node by its daemon-reported identity (retries while the beacon's 60s cache cycle fills)"
    func: net.http-check
    args: {"url": "http://10.2.0.102:7781/api/status", "contains": "\"node_name\":\"{{func.value}}\"", "require": "true"}
    retries: 3
    retry_delay: 5s
    os: linux

  - name: darwin-note
    description: "macOS: daemon is hand-started (no unit) — start it with -bind 0.0.0.0 -dashboard http://10.2.0.102:7781"
    command: 'echo "note: darwin daemon is hand-started; bind/beacon flags apply at the next manual start"'
    os: darwin
    on_failure: continue
