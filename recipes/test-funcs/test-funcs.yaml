# Selftest: native function steps (func:). Runs on every node, no shell.
name: test-funcs
description: >
  Regression selftest for the native function library. Exercises every
  stdlib func: step — typed outputs, {{func.*}} var passing, port-check
  up/down semantics, and the reserved-namespace rules. Run via:
  gogitops test run test-funcs (or recipe run test-funcs).
version: 1.2.0
test_module: true

steps:
  - name: disk-free
    description: stdlib storage function, math in the outputs
    func: storage.disk-free
    args: path=/
    expect: total_gb=
    set_attr: disk_free

  - name: var-passing
    description: outputs from step 1 flow into this command as {{func.*}}
    command: echo "saw {{func.used_pct}}% used of {{func.total_gb}}GB"
    expect_regex: "saw [0-9]+\\.??[0-9]*% used of [0-9]+\\.[0-9]+GB"

  - name: port-check-localhost
    description: down port returns up=false as a RESULT, not a failure
    func: net.port-check
    args: host=127.0.0.1,port=1,timeout=300ms
    expect: up=false

  - name: port-check-nas
    description: DNS port on the NAS — the fleet's actual dependency
    func: net.port-check
    args: host=10.2.0.103,port=53,timeout=2s
    expect: up=true

  - name: system-info
    description: typed identity probe, no shell uname
    func: system.info
    expect: hostname=

  - name: which-bash
    description: system.which PATH lookup — bash exists on every agent node
    func: system.which
    args: name=bash
    expect: found=true

  - name: which-missing
    description: not-found is a result (found=false), never an error
    func: system.which
    args: name=definitely-not-a-gogitops-command-xyz
    expect: found=false

  - name: http-check-self
    description: the agent's own health API answers — same endpoint the beacon polls
    func: net.http-check
    args: url=http://127.0.0.1:7780/v1/health, contains=hostname
    expect: up=true

  - name: github-asset-syncthing
    description: live GitHub release asset lookup (same repo the syncthing-mesh recipe uses) — soft-fails on rate limit
    func: net.github-asset
    args: repo=syncthing/syncthing, match=linux-amd64
    expect: url=https://
    on_failure: continue

  - name: lan-ip
    description: typed LAN IP probe — down is a result, not an error
    func: net.lan-ip
    expect_regex: "found=(true|false)"
    on_failure: continue

  - name: rc-line-preclean
    description: hermetic start — a stale file from an old run would poison the count
    command: rm -f /tmp/gogitops-functest-rc
    on_failure: continue

  - name: rc-line
    description: system.rc-line on a throwaway rc file (marker rides the line — appends on first sight)
    func: system.rc-line
    args: 'file=/tmp/gogitops-functest-rc, marker=GOGITOPS_FUNCTEST, line=\nexport GOGITOPS_FUNCTEST=1\n'
    expect: state=
    on_failure: continue

  - name: rc-line-second-run
    description: second run must report present — appends that repeat are churn
    func: system.rc-line
    args: 'file=/tmp/gogitops-functest-rc, marker=GOGITOPS_FUNCTEST, line=\nexport GOGITOPS_FUNCTEST=1\n'
    expect: state=present
    on_failure: continue

  - name: rc-line-verify
    description: byte-truth — exactly ONE export line landed across both runs (expect: alone cannot fail an exit-0 step)
    command: 'test "$(grep -c GOGITOPS_FUNCTEST /tmp/gogitops-functest-rc)" = "1" && echo rc-line-ok'
    on_failure: continue

  - name: rc-line-cleanup
    command: rm -f /tmp/gogitops-functest-rc
    on_failure: continue

  - name: rc-export-preclean
    command: rm -f /tmp/gogitops-functest-rc-export
    on_failure: continue

  - name: rc-export
    description: system.rc-export upsert on a throwaway rc file
    func: system.rc-export
    args: 'file=/tmp/gogitops-functest-rc-export, var=GOGITOPS_FUNCTEST_VAR, value=/tmp/answer, comment=fleet selftest'
    expect: state=
    on_failure: continue

  - name: rc-export-second-run
    description: second run must rewrite in place (updated, never a duplicate line)
    func: system.rc-export
    args: 'file=/tmp/gogitops-functest-rc-export, var=GOGITOPS_FUNCTEST_VAR, value=/tmp/answer2, comment=fleet selftest'
    expect: state=updated
    on_failure: continue

  - name: rc-export-verify
    description: byte-truth — one line total, and it carries the SECOND value (in-place rewrite, not append)
    command: 'test "$(grep -c "export GOGITOPS_FUNCTEST_VAR=" /tmp/gogitops-functest-rc-export)" = "1" && grep -q "answer2" /tmp/gogitops-functest-rc-export && echo rc-export-ok'
    on_failure: continue

  - name: rc-export-cleanup
    command: rm -f /tmp/gogitops-functest-rc-export
    on_failure: continue

  - name: login-trigger
    description: arms a throwaway oneshot user unit (harmless `true` payload) — skipped where no user session manager
    func: system.login-trigger
    args: '{"name": "gogitops-functest-trigger", "command": "true", "description": "fleet selftest trigger"}'
    when: "command -v systemctl >/dev/null 2>&1 && [ -d /run/user/$(id -u) ]"
    expect: state=armed
    on_failure: continue

  - name: login-trigger-cleanup
    description: disarm + remove the throwaway unit
    command: systemctl --user disable --now gogitops-functest-trigger.service 2>/dev/null; rm -f ~/.config/systemd/user/gogitops-functest-trigger.service; systemctl --user daemon-reload 2>/dev/null; true
    when: "command -v systemctl >/dev/null 2>&1 && [ -d /run/user/$(id -u) ]"
    on_failure: continue
