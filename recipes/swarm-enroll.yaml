name: swarm-enroll
description: "Enroll this node as a Docker Swarm worker, joining the NAS (10.2.0.103) as manager. Requires Docker installed (new-node recipe). Gets join token from the NAS manager via SSH, then joins the swarm."
version: "1.0.0"
labels: [docker-host]

steps:
  # ── 1. Verify Docker is installed and running ──
  - name: verify-docker
    description: "Confirm Docker daemon is running"
    command: "docker info --format '{{.ServerVersion}}'"
    on_failure: abort

  # ── 2. Check if already in a swarm ──
  - name: check-swarm
    description: "Check if node is already part of a swarm"
    command: "docker info --format '{{.Swarm.LocalNodeState}}'"
    parse: regex
    pattern: "(.+)"

  # ── 3. Get the swarm join token from the NAS manager ──
  # The NAS (10.2.0.103) is the swarm manager. We SSH in and get the worker token.
  # Uses the fleet SSH key for the NAS.
  - name: get-join-token
    description: "Fetch the worker join token from the NAS swarm manager"
    command: "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=5 -i ~/.ssh/id_hermes_nas Benn@10.2.0.103 '/share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker swarm join-token worker -q 2>/dev/null'"
    parse: regex
    pattern: "([A-Z0-9a-z-]+)"
    on_failure: abort

  # ── 4. Join the swarm as a worker ──
  - name: join-swarm
    description: "Join the Docker Swarm as a worker node"
    command: "docker swarm join --token {{.get-join-token}} 10.2.0.103:2377"
    on_failure: abort

  # ── 5. Verify swarm membership ──
  - name: verify-joined
    description: "Confirm node is now a swarm worker"
    command: "docker info --format '{{.Swarm.LocalNodeState}}'"
    on_failure: abort