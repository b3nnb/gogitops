name: agent-binary-bootstrap
description: "One-time rescue for agents stranded on an old binary at a non-writable path (/usr/local/bin — v0.7.22 wednesday, BCR-73): fetch the latest release from the git binaries branch, install it to ~/.local/bin/gogitops, repoint the launcher unit, and restart the daemon. No-op once /v1/health reports hardware specs (v0.7.29+). Never touches nodes that already report specs. v1.0.2: skip-check → typed system.file-state (same endpoint/pattern as wait-and-verify; a down check still passes — convergence records ok either way, exactly like the old curl|grep that exited 0 both ways). v1.1.0: the fetch/install/repoint/restart shell → typed system.git-extract (binaries branch, atomic dest swap, ≥500KB guard, arch from {{arch}}), system.unit-repoint, system.unit-restart (user→passwordless-sudo dance); the API-restart fallback stays shell, gated on scope=none."
version: "1.1.0"
labels: [new-node]   # only wednesday carries this tag
auto_apply: true

steps:
  - name: skip-if-current
    description: "Nodes already reporting hardware specs (v0.7.29+) are done — a down/unmatching check still passes so convergence records ok"
    func: system.file-state
    args: {"path": "http://127.0.0.1:7780/v1/health", "contains": "\"hardware\"", "timeout": "5s"}

  - name: read-binaries-version
    description: "Read binaries/VERSION off the fetched binaries branch (content-only extract — the old `git show origin/binaries:VERSION | tr -d \\n`)"
    func: system.git-extract
    args: '{"repo": "~/.config/gogitops", "ref": "origin/binaries", "path": "VERSION"}'
    set_attr: binaries_version
    on_failure: abort

  - name: fetch-latest-binary
    description: "Pull the latest linux binary for this arch off the binaries branch into ~/.local/bin/gogitops — atomic temp+rename, ≥500KB guard, exec bit (the old git-show/wc-chmod-mv blob)"
    func: system.git-extract
    args: '{"repo": "~/.config/gogitops", "ref": "origin/binaries", "path": "bin/gogitops-linux-{{arch}}", "dest": "~/.local/bin/gogitops", "min_bytes": "500000", "exec": "true"}'
    on_failure: abort

  - name: repoint-launcher
    description: "Point every user-level gogitops unit ExecStart at ~/.local/bin/gogitops (root-owned paths need sudo and are left alone — recipe re-verifies via the running daemon instead)"
    func: system.unit-repoint
    args: '{"units": "gogitops,gogitops-daemon", "from": "/usr/local/bin/gogitops,~/Documents/code/GoGitOps/bin/gogitops", "to": "~/.local/bin/gogitops"}'
    on_failure: continue

  - name: restart-daemon
    description: "Restart whichever gogitops daemon unit is active (user first, then system via passwordless sudo); scope=none (hand-started daemon) gates the API-restart fallback"
    func: system.unit-restart
    args: '{"user_units": "gogitops,gogitops-daemon", "system_units": "gogitops,gogitops-daemon"}'
    set_attr: daemon_restart
    on_failure: continue

  - name: api-restart-fallback
    description: "No unit owns the daemon — exec-restart via the agent's own API restart endpoint keeps the process lineage"
    when_attr: "attr.daemon_restart contains scope=none"
    command: 'curl -s -m 5 -X POST http://127.0.0.1:7780/v1/restart >/dev/null 2>&1 || true; echo api-restart-requested'
    on_failure: continue

  - name: wait-and-verify
    description: "Wait for the daemon to come back and confirm /v1/health now carries hardware specs"
    func: net.http-check
    args: url=http://127.0.0.1:7780/v1/health, contains=hardware, timeout=5s, require=true
    retries: 12
    retry_delay: 5s
