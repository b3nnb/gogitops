name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY=gogitops
          if [ "$GOOS" = "windows" ]; then BINARY=gogitops.exe; fi
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/${BINARY} ./cmd/gogitops

      - uses: actions/upload-artifact@v4
        with:
          name: gogitops-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in dist/gogitops-*; do
            name=$(basename "$dir")
            if [ -f "$dir/gogitops.exe" ]; then
              mv "$dir/gogitops.exe" "release/$name.exe"
            else
              mv "$dir/gogitops" "release/$name"
            fi
          done
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  deploy-nas:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Prepare binaries
        run: |
          mkdir -p release
          for dir in dist/gogitops-*; do
            name=$(basename "$dir")
            if [ -f "$dir/gogitops.exe" ]; then
              mv "$dir/gogitops.exe" "release/$name.exe"
            else
              mv "$dir/gogitops" "release/$name"
            fi
          done
          ls -la release/

      - name: Install smbclient
        run: sudo apt-get update && sudo apt-get install -y smbclient

      - name: Copy to NAS via SMB
        run: |
          for f in release/gogitops-*; do
            basename=$(basename "$f")
            echo "Uploading $basename → Infra/releases/gogitops/"
            smbclient "//${{ secrets.NAS_IP }}/Bifrost" \
              -U "${{ secrets.NAS_USER }}%${{ secrets.NAS_PASS }}" \
              -c "cd Infra/releases/gogitops; put $f $basename"
          done
