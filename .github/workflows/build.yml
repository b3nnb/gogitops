name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            deb_arch: amd64
            package: deb
          - goos: linux
            goarch: arm64
            deb_arch: arm64
            package: deb
          - goos: darwin
            goarch: arm64
            package: tarball
          - goos: darwin
            goarch: amd64
            package: tarball
          - goos: windows
            goarch: amd64
            package: zip

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout netenv repo
        uses: actions/checkout@v4
        with:
          repository: b3nnb/netenv
          path: netenv-repo
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build gogitops
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY=gogitops
          [ "${{ matrix.goos }}" = "windows" ] && BINARY=gogitops.exe
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/bin/$BINARY" ./cmd/gogitops

      - name: Build nenv-agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY=nenv-agent
          [ "${{ matrix.goos }}" = "windows" ] && BINARY=nenv-agent.exe
          cd netenv-repo
          go build -ldflags "-s -w" -o "../dist/bin/$BINARY" ./cmd/nenv-agent

      # ── Linux: build .deb package ──────────────────────────────
      - name: Build .deb package
        if: matrix.package == 'deb'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.0.0+${GITHUB_SHA:0:8}"

          DEB_ROOT="gogitops_${VERSION}_${{ matrix.deb_arch }}"
          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/usr/local/bin"
          mkdir -p "$DEB_ROOT/usr/lib/systemd/user"
          mkdir -p "$DEB_ROOT/etc/gogitops/ssh"

          # Binaries (gogitops + nenv-agent — nenv-agent dormant by default)
          cp dist/bin/gogitops "$DEB_ROOT/usr/local/bin/"
          cp dist/bin/nenv-agent "$DEB_ROOT/usr/local/bin/"
          chmod 755 "$DEB_ROOT/usr/local/bin/gogitops" "$DEB_ROOT/usr/local/bin/nenv-agent"

          # Config (clean template — no hardcoded fleet IPs or SSH keys)
          cp mesh.yaml.template "$DEB_ROOT/etc/gogitops/mesh.yaml"

          # Systemd (both services — nenv-agent rendered inert by postinst if not opted in)
          cp install/deb/systemd/gogitops-daemon.service "$DEB_ROOT/usr/lib/systemd/user/"
          cp install/deb/systemd/nenv-agent.service "$DEB_ROOT/usr/lib/systemd/user/"

          # Control files
          sed "s/__VERSION__/$VERSION/; s/__ARCH__/${{ matrix.deb_arch }}/" \
            install/deb/DEBIAN/control > "$DEB_ROOT/DEBIAN/control"
          cp install/deb/DEBIAN/postinst "$DEB_ROOT/DEBIAN/postinst"
          cp install/deb/DEBIAN/prerm "$DEB_ROOT/DEBIAN/prerm"
          cp install/deb/DEBIAN/postrm "$DEB_ROOT/DEBIAN/postrm"
          chmod 755 "$DEB_ROOT/DEBIAN/postinst" "$DEB_ROOT/DEBIAN/prerm" "$DEB_ROOT/DEBIAN/postrm"

          dpkg-deb --build "$DEB_ROOT"
          echo "DEB_FILE=${DEB_ROOT}.deb" >> $GITHUB_ENV

      # ── macOS: build .tar.gz tarball ────────────────────────────
      - name: Build macOS tarball
        if: matrix.package == 'tarball'
        run: |
          mkdir -p dist/config dist/systemd dist/ssh
          cp install/install.sh dist/
          cp install/systemd/*.tmpl dist/systemd/
          cp mesh.yaml dist/config/
          cp install/ssh/friday-automation.pub dist/ssh/
          chmod +x dist/install.sh
          NAME=gogitops-installer-darwin-${{ matrix.goarch }}
          tar czf $NAME.tar.gz -C dist .
          echo "TARBALL=$NAME.tar.gz" >> $GITHUB_ENV

      # ── Windows: build .zip ─────────────────────────────────────
      - name: Build Windows zip
        if: matrix.package == 'zip'
        run: |
          mkdir -p dist/config
          cp mesh.yaml dist/config/
          NAME=gogitops-installer-windows-${{ matrix.goarch }}
          cd dist && zip -r ../$NAME.zip . && cd ..
          echo "ZIP_FILE=$NAME.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: gogitops-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.DEB_FILE }}
            ${{ env.TARBALL }}
            ${{ env.ZIP_FILE }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Prepare release assets
        run: |
          mkdir -p release
          find dist/ \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            **Linux (deb) — self-registering, no config required:**
            ```bash
            curl -LO https://github.com/b3nnb/gogitops/releases/download/__TAG__/gogitops_*_amd64.deb
            sudo dpkg -i gogitops_*_amd64.deb
            ```

            The gogitops daemon starts immediately and self-registers to the mesh.
            Optional: paste a Discord webhook URL when prompted.

            ## NetEnv Integration (optional, OFF by default)

            nenv-agent is included but dormant. Three ways to enable:

            **Interactive:**
            Answer "y" when the installer asks "Enable NetEnv?"

            **Pre-seeded (non-interactive):**
            ```bash
            sudo GOGITOPS_NETENV=1 \
                 GOGITOPS_NETENV_SERVER=http://your-server:7200 \
                 GOGITOPS_NETENV_TOKEN=your-token \
                 dpkg -i gogitops_*_amd64.deb
            ```

            **Post-install:**
            ```bash
            sudo sed -i 's|# Configure server.*|http://your-server:7200|' /usr/lib/systemd/user/nenv-agent.service
            sudo sed -i 's|# Configure token.*|your-token|' /usr/lib/systemd/user/nenv-agent.service
            systemctl --user daemon-reload
            systemctl --user enable --now nenv-agent
            ```

            ## Uninstall
            ```bash
            sudo dpkg --remove gogitops
            ```
