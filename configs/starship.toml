# Starship prompt config — gogitops fleet
# Deploy: cp starship.toml ~/.config/starship.toml
# Login dashboard: ~/bin/dashboard

format = """
$directory\
$git_branch\
$git_status\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"

[cmd_duration]
min_time = 5_000
format = " [$duration]($style) "
style = "bold yellow"
