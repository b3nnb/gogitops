# Starship prompt config — gogitops fleet
# Install: cp starship.toml ~/.config/starship.toml
# Deploy: gogitops recipes will copy this to each node

format = """
$directory\
$git_branch\
$git_status\
$aws\
$gcloud\
$custom\
$disk_usage\
$line_break\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"

[aws]
format = "on [$symbol($profile)]($style) "
style = "bold yellow"
symbol = " "

# Disk usage — show mount points with usage %
[disk_usage]
format = "[$path]($style) "
style = "bold yellow"
disabled = false

# Custom: GPU detection
[custom.gpu]
description = "Show detected GPU"
command = "nvidia-smi --query-gpu=name,memory.used,memory.total --format=csv,noheader,nounits 2>/dev/null | awk -F', ' '{printf \"%s %s/%sMi\", $1, $2, $3}' || echo 'no gpu'"
when = "which nvidia-smi 2>/dev/null"
format = "[$output]($style) "
style = "bold green"
shell = ["bash", "--noprofile", "--norc"]

# Custom: gogitops node health
[custom.gogitops]
description = "Show gogitops node health status"
command = "cat ~/.cache/gogitops/prompt.json 2>/dev/null | python3 -c \"import sys,json; d=json.load(sys.stdin); host=d.get('hostname','?'); svcs=d.get('services_healthy',False); down=d.get('services_down',[]); neb=d.get('nebula_running',False); ok=svcs and len(down)==0; icon='🟢' if ok else '🔴'; out=f'{icon} {host}'; if down: out+=f' ↓{chr(44).join(down)}'; if not neb: out+=' nebula✗'; print(out)\" 2>/dev/null || echo '⚪ gogitops'"
when = "test -f ~/.cache/gogitops/prompt.json"
format = "[$output]($style) "
style = "bold cyan"
shell = ["bash", "--noprofile", "--norc"]

# Right prompt — gogitops + gpu on the right side
rightformat = """
$custom.gogitops\
$custom.gpu\
$cmd_duration"""

[cmd_duration]
min_time = 5_000
format = " [$duration]($style) "
style = "bold yellow"